name: Release

on:
  push:
    tags: [ '*.*.*' ]

jobs:
  build:
    uses: ./.github/workflows/build-base.yml

  pypi:
    # opt-in: set the PUBLISH_TO_PYPI repository variable to "true" once a PyPI trusted publisher is set up
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      UV_SYSTEM_PYTHON: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish

  release:
    permissions:
      contents: write
    runs-on: ubuntu-slim
    needs: [build]
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8

      - name: Setup distribution dir
        run: mkdir dist

      - name: Copy binaries
        run: |
          oses=("Linux" "macOS" "Windows")
          arches=("X64" "ARM64")
          for os in ${oses[@]}; do
            for arch in ${arches[@]}; do
                file="./$os-$arch-package/heirloom"*
                if [ -f $file ]; then
                    filename=$(basename $file)
                    ext=${filename#*.}
                    if [[ "$ext" == "$filename" ]]; then
                        ext=""
                    else
                        ext=".$ext"
                    fi
                    cp $file "./dist/heirloom_${os,}_${arch,,}$ext"
                fi
            done
          done

      - name: Copy installer
        run: cp ./Windows-X64-installer/*.exe ./dist/

      - name: Package macOS zip
        working-directory: dist
        # downloading the builds as artifacts loses their permission to run, which the zip then keeps
        run: |
          chmod +x heirloom_macOS_*
          7z a heirloom_macOS.zip heirloom_macOS_*
          test "$(7z l -slt heirloom_macOS.zip | grep -c -- '-rwx')" = 2

      - uses: actions/upload-artifact@v7
        with:
          name: macOS-zip
          path: dist/heirloom_macOS.zip

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.server_url }}/${{ github.repository }}" --draft --generate-notes --verify-tag ./dist/heirloom*

  # what someone on a Mac gets: the zip itself, unzipped and run, on each kind of Mac
  test-macos-zip:
    needs: [release]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['macos-15', 'macos-15-intel']
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macOS-zip

      - run: |
          unzip heirloom_macOS.zip
          ./heirloom_macOS_$(uname -m | sed s/x86_64/x64/) --version
