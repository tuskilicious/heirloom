name: Build Base

on:
  workflow_call:

jobs:
  pyinstaller:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
          'windows-2025', 'windows-11-arm',
          'macos-15-intel', 'macos-15'
        ]
      fail-fast: false
    env:
      UV_SYSTEM_PYTHON: 1

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        # Newest Python PyInstaller can bundle; requires-python alone resolves to the latest release
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Dependencies and build tools
      run: uv sync --extra pyinstaller_build --no-install-local

    - name: Optional dependencies (WebView)
      run: uv sync --extra webview --no-install-local --inexact
      if: runner.os != 'macOS'

    - name: Set strip option on non-Windows
      id: strip
      run: echo "option=--strip" >> $GITHUB_OUTPUT
      if: runner.os != 'Windows'

    - name: Build
      working-directory: heirloom
      run: uv run --module PyInstaller
        --onefile
        --name heirloom
        --add-data gui/web:heirloom/gui/web
        ${{ steps.strip.outputs.option }}
        -i ../assets/windows_icon.ico
        cli.py
      env:
        PYTHONOPTIMIZE: 1

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-package
        path: heirloom/dist/*

    - name: Build the installer
      if: runner.os == 'Windows' && runner.arch == 'X64'
      shell: pwsh
      run: |
        Push-Location heirloom
        uv run --module PyInstaller --onedir --name heirloom --add-data gui/web:heirloom/gui/web `
          -i ../assets/windows_icon.ico --distpath ../installer/build --workpath build/onedir cli.py
        Pop-Location
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
        $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
        & $iscc "/DAppVersion=$version" installer\heirloom.iss
        if ($LASTEXITCODE) { throw "ISCC failed with $LASTEXITCODE" }
      env:
        PYTHONOPTIMIZE: 1

    - name: Test the installer
      if: runner.os == 'Windows' && runner.arch == 'X64'
      shell: pwsh
      run: |
        $dir = Join-Path $env:RUNNER_TEMP 'Heirloom'
        $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
        $setup = Start-Process installer\Output\heirloom_windows_x64_setup.exe -ArgumentList ($silent + "/DIR=`"$dir`"") -Wait -PassThru
        if ($setup.ExitCode) { throw "setup exited with $($setup.ExitCode)" }
        $version = & "$dir\heirloom.exe" -V
        if ($version -notlike '*heirloom version*') { throw "heirloom.exe -V printed: $version" }
        $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Heirloom.lnk'
        $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
        if ($shortcut.TargetPath -ne "$dir\heirloom.exe" -or $shortcut.Arguments -ne 'gui') { throw "Start menu shortcut runs: $($shortcut.TargetPath) $($shortcut.Arguments)" }
        if ((Get-ItemProperty HKCU:\Environment).Path -notlike "*$dir*") { throw 'not added to PATH' }
        "installed: $version"

        Start-Process "$dir\unins000.exe" -ArgumentList $silent -Wait
        # the uninstaller finishes from a copy of itself
        for ($i = 0; $i -lt 60 -and (Test-Path "$dir\heirloom.exe"); $i++) { Start-Sleep 1 }
        if (Test-Path "$dir\heirloom.exe") { throw 'heirloom.exe is still there after uninstalling' }
        if (Test-Path $lnk) { throw 'the Start menu shortcut is still there after uninstalling' }
        if ((Get-ItemProperty HKCU:\Environment).Path -like "*$dir*") { throw 'the PATH entry is still there after uninstalling' }
        'uninstalled cleanly'

    - uses: actions/upload-artifact@v7
      if: runner.os == 'Windows' && runner.arch == 'X64'
      with:
        name: Windows-X64-installer
        path: installer/Output/*.exe

  zipapp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
          'ubuntu-24.04', 'ubuntu-24.04-arm'
        ]
      fail-fast: false

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version-file: "pyproject.toml"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - run: mkdir -p build dist

    - name: Dependencies
      run: uv export --format requirements.txt --no-editable --no-dev | uv pip install --requirement - --target build

    - run: cp zipapp_main.py build/__main__.py

    - name: Build
      run: python -m zipapp
        --output dist/heirloom
        --python "/usr/bin/env python3"
        --compress
        build

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-package
        path: dist/heirloom
