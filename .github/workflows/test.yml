name: Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ 'ubuntu-24.04', 'windows-2025', 'macos-15' ]
        python-version: [ '3.10', '3.14' ]
      fail-fast: false

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - run: uv sync --locked

    - run: uv run pytest

  mypy:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - run: uv sync --locked

    - name: Type check for each target platform
      run: |
        uv run mypy --platform linux
        uv run mypy --platform darwin
        uv run mypy --platform win32
