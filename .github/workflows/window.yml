name: Window

on:
  push:
    branches: [ 'claude/linux-mac' ]

jobs:
  appimage:
    runs-on: ubuntu-22.04
    env:
      UV_SYSTEM_PYTHON: 1
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: What Qt's window needs to be bundled
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libnss3 libnspr4 \
          libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libxkbfile1 libxcb-cursor0 libxcb-icccm4 \
          libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 fontconfig

    - run: uv sync --extra pyinstaller_build --extra webview_qt --no-install-local

    - name: Build
      run: |
        uv pip install --python .venv pillow
        uv run --module PyInstaller --distpath installer/build --workpath build/onedir installer/heirloom.spec
        du -sh installer/build/heirloom
        du -s installer/build/heirloom/_internal/* | sort -n | tail -15
        du -d 3 installer/build/heirloom/_internal/PySide6 | sort -n | tail -14
        du -s installer/build/heirloom/_internal/PySide6/Qt/lib/* | sort -n | tail -30
        du -s installer/build/heirloom/_internal/PySide6/Qt/plugins/* | sort -n | tail -16
        du -s installer/build/heirloom/_internal/PySide6/Qt/qml/* | sort -n | tail -10
        ls -S installer/build/heirloom/_internal/PySide6 | head -30
        uv run sh installer/build_appimage.sh
        ls -l installer/Output
      env:
        PYTHONOPTIMIZE: 1

    - uses: actions/upload-artifact@v7
      with:
        name: appimage
        path: installer/Output/*.AppImage

  try-appimage:
    needs: [appimage]
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v8
      with:
        name: appimage

    - uses: astral-sh/setup-uv@v7

    - name: Run it on a clean system
      run: |
        chmod +x heirloom_linux_x64.AppImage
        ls /dev/fuse; which fusermount fusermount3 || true
        ./heirloom_linux_x64.AppImage -V
        sysctl kernel.apparmor_restrict_unprivileged_userns || true
        unshare -Ur true; echo "unshare says $?"

    - name: The window, sandbox on
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        export HEIRLOOM_CONFIG_PATH=$RUNNER_TEMP/config QTWEBENGINE_REMOTE_DEBUGGING=9222 PYWEBVIEW_GUI=qt
        xvfb-run -a -s "-screen 0 1280x820x24" ./heirloom_linux_x64.AppImage gui > window.log 2>&1 &
        uv run --no-project --with websocket-client python tests/window_probe.py 9222 shots-sandbox || echo "PROBE FAILED"
        tail -40 window.log
        pkill -f heirloom || true
        sleep 2

    - name: The window, sandbox off
      run: |
        export HEIRLOOM_CONFIG_PATH=$RUNNER_TEMP/config2 QTWEBENGINE_REMOTE_DEBUGGING=9223 PYWEBVIEW_GUI=qt QTWEBENGINE_DISABLE_SANDBOX=1
        xvfb-run -a -s "-screen 0 1280x820x24" ./heirloom_linux_x64.AppImage gui > window2.log 2>&1 &
        uv run --no-project --with websocket-client python tests/window_probe.py 9223 shots-nosandbox || echo "PROBE FAILED"
        tail -40 window2.log
        pkill -f heirloom || true

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: linux-shots
        path: shots-*

  mac:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      UV_SYSTEM_PYTHON: 1
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - run: uv sync --extra pyinstaller_build --extra webview_qt --no-install-local

    - name: Build
      run: |
        uv pip install --python .venv pillow
        uv run --module PyInstaller --distpath installer/build --workpath build/onedir installer/heirloom.spec
        du -sh installer/build/Heirloom.app
        du -d 2 installer/build/Heirloom.app/Contents | sort -n | tail -8
        hdiutil create -volname Heirloom -srcfolder installer/build/Heirloom.app -ov -format UDZO heirloom_macos_arm64.dmg
        ls -l heirloom_macos_arm64.dmg
      env:
        PYTHONOPTIMIZE: 1

    - name: The window
      run: |
        installer/build/Heirloom.app/Contents/MacOS/heirloom -V
        export HEIRLOOM_CONFIG_PATH=$RUNNER_TEMP/config QTWEBENGINE_REMOTE_DEBUGGING=9222 PYWEBVIEW_GUI=qt
        installer/build/Heirloom.app/Contents/MacOS/heirloom gui > window.log 2>&1 &
        uv run --no-project --with websocket-client python tests/window_probe.py 9222 shots-mac || echo "PROBE FAILED"
        tail -40 window.log
        pkill -f Heirloom || true

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: mac-shots
        path: shots-*
