[build-system]
requires = ["uv_build>=0.11.4,<0.12"]
build-backend = "uv_build"

[project]
name = "legendary-gl"
version = "0.21.1"
dependencies = [
    "requests",
    "filelock",
    "pycryptodomex",
]
requires-python = ">= 3.10"
authors = [
    {name = "Rodney", email = "rodney@rodney.io"}
]
description = "Free and open-source replacement for the Epic Games Launcher application"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment",
    "Development Status :: 4 - Beta",
]

[project.optional-dependencies]
webview = ["pywebview>=3.4"]
webview_gtk = ["pywebview>=3.4", "PyGObject"]
pyinstaller_build = ["pyinstaller"]

[project.scripts]
legendary = "legendary.cli:main"

[project.urls]
source = "https://github.com/derrod/legendary"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.15.10",
    "types-requests>=2.33.0.20261006",
]

[tool.uv]
required-version = ">=0.11.0"

[tool.uv.build-backend]
module-name = "legendary"
module-root = ""

[tool.ruff]
extend-exclude = ["zipapp_main.py"]

[tool.ruff.lint]
select = [ "E",  "F",  "UP",  "B",  "SIM",  "I",  "PTH" ]
ignore = [ "E501", "UP015", "SIM102", "SIM115", "B905", "UP045" ]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
# fail on deprecated stdlib calls in our own code before they are removed
filterwarnings = ["error::DeprecationWarning:legendary.*"]

[tool.mypy]
python_version = "3.10"
files = ["legendary"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["webview", "webview.*"]
ignore_missing_imports = true

# Ratchet: these still set attributes to None and fill them in later, which mypy can't
# follow inside unannotated functions. Remove a module from this list once it passes.
[[tool.mypy.overrides]]
module = [
    "legendary.api.egs",
    "legendary.cli",
    "legendary.core",
    "legendary.downloader.mp.workers",
    "legendary.models.chunk",
    "legendary.models.egl",
    "legendary.models.manifest",
    "legendary.utils.webview_login",
]
check_untyped_defs = false
